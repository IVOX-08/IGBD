<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGBD Vaktija — App herunterladen</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="Logo.png">
    <meta name="theme-color" content="#00612F">

    <!--
        DIESE SEITE IST FÜR DEN FERNSEHER GEBAUT, für nichts anderes.

        Sie hängt an keiner anderen Datei: kein device-detect.js, kein style-tv.css,
        kein script.js. Damit kann an ihr nichts kaputtgehen, wenn an der
        Gebetszeiten-Seite etwas geändert wird — und umgekehrt.

        AUFBAU: iPhone links, Wappen und Text in der Mitte, Android rechts.
        Symmetrisch, weil beide Codes gleich wichtig sind — und weil zwei Leute
        gleichzeitig scannen können, ohne sich vor demselben Fleck zu drängeln.

        Drei Dinge bestimmen jede Entscheidung hier:

        1. SIE SCROLLT NIE. Eine Wand hat niemanden, der wischt. Alle Maße in vh/vw,
           deshalb sitzt sie auf 720p, 1080p und 4K gleich.
        2. ÜBERSCHUSSRAND. Ältere Fernseher schneiden bis zu 5 % am Rand ab. Nichts
           Wichtiges kommt der Kante näher.
        3. DER CODE IST DAS MOTIV. Er wird aus mehreren Metern gescannt, also ist er
           so groß, wie Höhe UND Breite es zulassen — min(48vh, 27vw), damit er auf
           keinem Seitenverhältnis über den Rand läuft. Reines Weiß rundherum, mit
           Ruhezone, und nichts liegt darüber.
    -->
    <style>
        :root {
            --green:      #008348;   /* IZ zelena */
            --green-deep: #00401f;
            --gold:       #D4AF37;
            --ink:        #0f1a13;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;              /* nichts scrollt, nie */
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background:
                radial-gradient(120% 90% at 50% 0%, #0a9c58 0%, transparent 62%),
                linear-gradient(170deg, var(--green) 0%, var(--green-deep) 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Ruhiger Lichtschein hinter der Mitte, damit die Fläche nicht flach wirkt. */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(55% 55% at 50% 50%, rgba(255,255,255,.08), transparent 70%);
            pointer-events: none;
        }

        .stage {
            position: relative;
            width: 90vw;                   /* Überschussrand: 5 % je Seite */
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
        }

        /* ---------- Mitte: Wappen und Text ---------- */

        .middle {
            flex: 0 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 1vw;
        }

        .crest {
            width: 21vh;
            height: 21vh;
            border-radius: 50%;
            background: #fff;
            padding: 1.5vh;
            box-shadow: 0 1.4vh 3.4vh rgba(0,0,0,.3);
        }
        .crest img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .wordmark {
            font-size: 5.9vh;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.02em;
            margin-top: 2.4vh;
            white-space: nowrap;
        }

        .place {
            font-size: 2.4vh;
            font-weight: 700;
            color: var(--gold);
            margin-top: .8vh;
            white-space: nowrap;
        }

        .rule {
            width: 8vh;
            height: .5vh;
            background: var(--gold);
            border-radius: 1vh;
            margin: 2.8vh 0;
        }

        .call {
            font-size: 2.9vh;
            font-weight: 800;
            line-height: 1.3;
            white-space: nowrap;
        }

        /* ---------- aussen: die beiden Codes ---------- */

        .card {
            flex: 0 0 auto;
            background: #fff;
            border-radius: 2.6vh;
            padding: 2.4vh 2.4vh 2.8vh;
            box-shadow: 0 2.2vh 5.5vh rgba(0,0,0,.32);
            text-align: center;
        }

        /* Reines Weiß rundherum gehört zum Code — ohne diese Ruhezone findet eine
           Kamera die drei Ecken nicht zuverlässig. */
        .card img {
            display: block;
            width: min(48vh, 27vw);
            height: min(48vh, 27vw);
            image-rendering: pixelated;    /* harte Kanten statt weichgezeichneter Module */
        }

        /* Die Plattform ist die Hauptinformation: sie sagt, WELCHEN Code man nimmt.
           Der App-Name darunter ist die Bestätigung, dass man richtig gelandet ist. */
        .platform {
            display: block;
            margin-top: 2vh;
            font-size: 4.4vh;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.01em;
            color: var(--ink);
        }

        .appname {
            display: block;
            margin-top: .9vh;
            font-size: 2.2vh;
            font-weight: 700;
            color: #5f7268;
        }

        /* ---------- schmal oder hochkant ---------- */

        /* Falls doch jemand die Seite am Handy öffnet: Mitte nach oben, Codes
           darunter, und dann darf gescrollt werden. */
        @media (max-aspect-ratio: 1/1) {
            html, body { overflow: auto; height: auto; }
            body { padding: 5vh 5vw; }
            .stage {
                width: 100%;
                height: auto;
                flex-direction: column;
                gap: 4vh;
            }
            .middle { order: -1; }
            .crest { width: 17vh; height: 17vh; }
            .wordmark { font-size: 5vh; }
            .card img { width: min(38vh, 74vw); height: min(38vh, 74vw); }
            .platform { font-size: 3.6vh; }
            .call { white-space: normal; }
        }
    </style>
</head>
<body>

    <div class="stage">

        <div class="card">
            <img src="qr-iphone.png" alt="QR-Code für iPhone">
            <span class="platform">iPhone</span>
            <span class="appname">IGBD Vaktija</span>
        </div>

        <div class="middle">
            <div class="crest"><img src="Logo.png" alt="IGBD-Gemeinde Sandžak-Kassel"></div>

            <div class="wordmark">IGBD Vaktija</div>
            <div class="place">Gemeinde Sandžak&nbsp;Kassel</div>

            <div class="rule"></div>

            <div class="call">Laden Sie die App herunter</div>
        </div>

        <div class="card">
            <img src="qr-android.png" alt="QR-Code für Android">
            <span class="platform">Android</span>
            <span class="appname">Kassel Vaktija</span>
        </div>

    </div>

</body>
</html>
