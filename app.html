<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGBD Vaktija — App herunterladen</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="Logo.png">
    <meta name="theme-color" content="#00612F">

    <!--
        DIESE SEITE IST FÜR DEN FERNSEHER GEBAUT, für nichts anderes.

        Sie hängt an keiner anderen Datei: kein device-detect.js, kein style-tv.css,
        kein script.js. Damit kann an ihr nichts kaputtgehen, wenn an der
        Gebetszeiten-Seite etwas geändert wird — und umgekehrt.

        AUFBAU, von oben nach unten:
            IGBD Vaktija            (nur der Name, kein Wappen)
            die beiden Codes        (so groß wie überhaupt möglich)
            Laden Sie die App herunter

        DIE CODES BEKOMMEN DEN GANZEN REST. Sie sind nicht auf eine hübsche Zahl
        gesetzt, sondern auf das, was nach Titel, Beschriftungen und der Zeile unten
        übrig bleibt — deshalb steht bei .card img eine Rechnung und keine feste
        Größe. Höhe UND Breite werden geprüft (min(...)), damit sie auf keinem
        Seitenverhältnis über den Rand laufen.

        Zwei Dinge bleiben, egal wie groß:
        - SIE SCROLLT NIE. Eine Wand hat niemanden, der wischt.
        - REINES WEISS RUNDHERUM. Die Ruhezone gehört zum Code; ohne sie findet eine
          Kamera die drei Ecken nicht zuverlässig.
    -->
    <style>
        :root {
            --green:      #008348;   /* IZ zelena */
            --green-deep: #00401f;
            --gold:       #D4AF37;
            --ink:        #0f1a13;

            /* Was NEBEN den Codes noch Höhe braucht — Titel, Beschriftungen,
               Polster, Zeile unten. Ändert man oben etwas, ändert man diese Zahl,
               und die Codes passen sich von selbst an. */
            --chrome: 35vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;              /* nichts scrollt, nie */
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background:
                radial-gradient(120% 90% at 50% 0%, #0a9c58 0%, transparent 62%),
                linear-gradient(170deg, var(--green) 0%, var(--green-deep) 100%);
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .stage {
            position: relative;
            width: 94vw;                   /* Überschussrand: 3 % je Seite */
            height: 92vh;                  /* und 4 % oben wie unten: bei 96vh blieben unten
                                              nur 22 Pixel, und ein Fernseher, der den Rand
                                              beschneidet, hätte die Zeile gekappt */
            margin: 4vh auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* ---------- oben: nur der Name ---------- */

        .wordmark {
            font-size: 7vh;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.02em;
            white-space: nowrap;
        }

        /* ---------- Mitte: die beiden Codes, so groß wie es geht ---------- */

        .codes {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4vw;
        }

        .card {
            background: #fff;
            border-radius: 2.4vh;
            padding: 2vh 2vh 2.4vh;
            box-shadow: 0 2vh 5vh rgba(0,0,0,.32);
            text-align: center;
        }

        .card img {
            display: block;
            /* Der ganze Rest der Höhe — und nie breiter, als zwei Karten
               nebeneinander vertragen. */
            width:  min(calc(100vh - var(--chrome)), 41vw);
            height: min(calc(100vh - var(--chrome)), 41vw);
            image-rendering: pixelated;    /* harte Kanten statt weichgezeichneter Module */
        }

        /* Die Plattform ist die Hauptinformation: sie sagt, WELCHEN Code man nimmt. */
        .platform {
            display: block;
            margin-top: 1.6vh;
            font-size: 4.2vh;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.01em;
            color: var(--ink);
        }

        .appname {
            display: block;
            margin-top: .6vh;
            font-size: 2.1vh;
            font-weight: 700;
            color: #5f7268;
        }

        /* ---------- unten: der Aufruf ---------- */

        .call {
            font-size: 4vh;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        /* ---------- schmal oder hochkant ---------- */

        /* Falls doch jemand die Seite am Handy öffnet: untereinander, und dann darf
           gescrollt werden. */
        @media (max-aspect-ratio: 1/1) {
            html, body { overflow: auto; height: auto; }
            .stage {
                width: 90vw;
                height: auto;
                margin: 5vh auto;
                gap: 4vh;
            }
            .wordmark { font-size: 5vh; }
            .codes { flex-direction: column; gap: 4vh; }
            .card img { width: min(60vh, 78vw); height: min(60vh, 78vw); }
            .platform { font-size: 3.6vh; }
            .call { font-size: 3vh; white-space: normal; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="stage">

        <div class="wordmark">IGBD Vaktija</div>

        <div class="codes">

            <div class="card">
                <img src="qr-iphone.png" alt="QR-Code für iPhone">
                <span class="platform">iPhone</span>
                <span class="appname">IGBD Vaktija</span>
            </div>

            <div class="card">
                <img src="qr-android.png" alt="QR-Code für Android">
                <span class="platform">Android</span>
                <span class="appname">Kassel Vaktija</span>
            </div>

        </div>

        <div class="call">Laden Sie die App herunter</div>

    </div>

</body>
</html>
