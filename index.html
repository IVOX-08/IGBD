<!DOCTYPE html>
<html lang="de">
<head>
    <head>
    <link rel="apple-touch-icon" href="Logo.png">
    <link rel="icon" type="image/png" href="Logo.png">
    
    <meta name="apple-mobile-web-app-title" content="Kassel Vaktija">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandžak Kassel - Sprache / Jezik</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
        // Automatischer Check: Wenn Sprache schon gewählt, sofort weiterleiten
        (function() {
            const savedLang = localStorage.getItem('selectedLanguage');
            if (savedLang) {
                window.location.href = savedLang + ".html";
            }
        })();

        // Funktion zum Speichern und Weiterleiten
        function selectLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            window.location.href = lang + ".html";
        }
    </script>
</head>
<body>

    <div class="language-selection">
        <img src="Logo.png" alt="Sandžak Kassel Logo" class="selection-logo">
        
        <h2 class="selection-title">
            Sprache wählen <br>
            <span>Izaberi jezik</span>
        </h2>
        
        <div class="button-container">
            <button class="lang-btn" onclick="selectLanguage('de')">
                Deutsch
            </button>
            
            <button class="lang-btn" onclick="selectLanguage('bs')">
                Bosanski
            </button>
        </div>
    </div>

</body>
</html>
